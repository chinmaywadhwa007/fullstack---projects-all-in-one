<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>todo list </title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- here we make the container for the to do list where the main thing works  -->
    <div class="container">
        <!-- title of the page todo list  -->
        <h3>TO DO list </h3>
        <!-- this is the inner code where we add task in it  -->
        <div class="input-container">
            <!-- this goes to the text  -->
            <input type="text" id="todo-input" placeholder="add new task here ">
            <!-- here comes the button part of the task this will add the task to work  -->
            <button id="addbtn">add-task</button>
        </div>
        <ul class="list">

        </ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
