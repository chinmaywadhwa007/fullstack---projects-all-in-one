<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e commerce check out step</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="shopping-container">
        <h3>products</h3>
        <div id="product-list">
            <!-- list will be added by js here   -->
        </div>
        <h2>shopping cart</h2>
        <div id="cart-items">
            <p id="empty-cart">your cart is empty please fill the cart first </p>
        </div>
        <div id="cart-total" >
            <p>total amount:<span id="total-price" class="hidden">$0.00</span></p>
            <button id="checkout">CheckOut</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
