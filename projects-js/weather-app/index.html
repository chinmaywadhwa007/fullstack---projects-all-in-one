<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather-app</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container">
        <!-- this is for the heading  -->
        <h3>weather-app</h3> 
        <!-- whats going on inside the container  -->
        <div id="weather-container">
            <input type="text" id="city-input" placeholder="Enter your city name">
            <button class="btn-w">get weather</button>
        </div>
        <!-- spinner  -->
        <p id="loading" class="loader hidden"></p>
        <!-- data information will go here... -->
        <div id="info" class="hidden">
            <h2 id="city-name"></h2>
            <p id="temp"></p>
            <p id="details"></p>
        </div>
        <!-- error msg will go here  -->
        <p id="error" class="hidden">city not found.please try again letter</p>
    </div>
    <script src="script.js"></script>
</body>

</html>
