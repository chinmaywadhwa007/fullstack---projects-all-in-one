<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>practice dom world </title>
</head>
    <style>
        #btn{
            cursor: pointer;
            
        }
        #btn:hover{
            cursor: pointer;
            background-color: black;
            color: white;
            transition: ease-in-out 10ms;
        }
        .dark{
            background-color: black;
            color: bisque;
        }
        #toggle:hover{
            background-color: lightblue;
            color: black;
            cursor: pointer;
            transition: ease-in 2ms;
        }
    </style>
<body>
    <p id="text">hello world</p>
    <button id="btn">submit</button>
    <button id="toggle">dark mode </button>
    <script src="practice-dom.js"></script>
</body>
</html>
