<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page with tailwind css </title>
    <link rel="stylesheet" href="./output.css">
</head>
<!-- this is the shotest login form that i have made with good styling just by using tailwind css wow  -->
<body class="bg-gray-700 flex justify-center items-center min-h-screen text-amber-50">
    <div class="bg-gray-800 rounded-lg p-8 shadow-lg max-w-sm w-full">

        <h3 class="text-center mb-4 font-semibold text-lg">
            Login form with <span class="text-blue-500">Tailwind</span>
        </h3>

        <!-- ONE FORM ONLY -->
        <form class="space-y-4">

            <!-- EMAIL -->
            <div>
                <label class="block mb-1 text-sm font-bold ">Email</label>
                <input type="email" required placeholder="Enter email" class="w-full p-2 rounded bg-gray-700 text-white border border-gray-500
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                            rounded-b-md">
            </div>

            <!-- PASSWORD -->
            <div>
                <label class="block mb-1 text-sm font-bold">Password</label>
                <input type="password" required placeholder="Enter password"
                    class="w-full p-2 rounded bg-gray-700 text-shadow-amber-100 border border-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- BUTTON -->
            <button type="submit"
                class="w-full bg-blue-600 hover:text-black py-2 rounded-lg text-lg transition cursor-pointer font-semibold hover:bg-blue-700">
                Login Here
            </button>

        </form>
    </div>
</body>

</html>
